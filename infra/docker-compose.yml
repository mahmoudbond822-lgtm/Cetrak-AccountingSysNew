services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cetrak"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:5173"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
