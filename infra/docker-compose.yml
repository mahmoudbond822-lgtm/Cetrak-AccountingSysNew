services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cetrak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    entrypoint: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    entrypoint: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  worker:
    profiles: ["worker"]
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: cetrak
      POSTGRES_USER: cetrak
      POSTGRES_PASSWORD: cetrak
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  pgdata:
